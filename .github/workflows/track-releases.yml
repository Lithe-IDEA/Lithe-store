name: Track plugin releases

# Scans the GitHub Releases of every listed plugin, and of every unlisted
# public `lithe-plugin-*` repository in the Lithe-IDEA organization except
# `lithe-plugin-docs`, and adds the versions and plugins not yet in the index.
# Plugin authors only need to publish a release that follows docs/publishing.md.
#
# The scan runs once per scope, and each scope keeps its own pull request:
#
# - organization: plugins whose repository belongs to the Lithe-IDEA organization,
#   including first listings. After the archives are verified, the workflow
#   merges the pull request itself with a token of the Lithe Store Bot GitHub
#   App, the only bot that the "Only owners merge main" ruleset lets through.
# - external: every other plugin. The pull request waits for a maintainer
#   review, and this scope never receives the app token.
on:
  schedule:
    - cron: "41 */6 * * *"
  workflow_dispatch:
    inputs:
      plugin:
        description: "Only track this plugin ID, listed or a new organization plugin (empty = all)"
        required: false
        default: ""

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: track-releases
  cancel-in-progress: false

jobs:
  track:
    name: track (${{ matrix.scope }})
    # The workflow writes main's index and may push to main, so it must run the
    # workflow and scripts from main. A manual run from another branch does nothing.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      # One scope at a time, organization first, so the external branch starts
      # from the main that the organization scope may have just updated.
      max-parallel: 1
      fail-fast: false
      matrix:
        include:
          - scope: organization
            branch: bot/track-organization-releases
            title: "chore(index): 追踪 Lithe-IDEA 组织插件新版本"
          - scope: external
            branch: bot/track-releases
            title: "chore(index): 追踪组织外插件新版本"
    env:
      SCOPE: ${{ matrix.scope }}
      BRANCH: ${{ matrix.branch }}
      TITLE: ${{ matrix.title }}
    steps:
      # Only the organization scope may merge into main, so only it asks for the
      # app token. Without the app, both scopes fall back to the tokens below.
      - name: Create the Lithe Store Bot token
        id: bot
        if: matrix.scope == 'organization' && vars.STORE_BOT_APP_CLIENT_ID != ''
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.STORE_BOT_APP_CLIENT_ID }}
          private-key: ${{ secrets.STORE_BOT_APP_PRIVATE_KEY }}

      # Every step below that pushes or calls gh uses the same token, chosen in
      # this order: the app token, then the optional STORE_BOT_TOKEN secret
      # (fine-grained PAT: contents + pull requests), then GITHUB_TOKEN. A pull
      # request opened with GITHUB_TOKEN does not trigger `Validate index`.
      - uses: actions/checkout@v7
        with:
          # The latest main, not the commit that triggered the run: the external
          # scope must start from the main that the organization scope just updated.
          ref: main
          token: ${{ steps.bot.outputs.token || secrets.STORE_BOT_TOKEN || github.token }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Find new releases
        id: track
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PLUGIN: ${{ inputs.plugin }}
        run: |
          cp lithe-plugin-index.json "$RUNNER_TEMP/base-index.json"
          args=(--scope "$SCOPE")
          if [ -n "$PLUGIN" ]; then args+=(--plugin "$PLUGIN"); fi
          node scripts/track-releases.mjs lithe-plugin-index.json "${args[@]}"

      - name: Close the obsolete pull request
        if: steps.track.outputs.added == '0' && inputs.plugin == ''
        env:
          GH_TOKEN: ${{ steps.bot.outputs.token || secrets.STORE_BOT_TOKEN || github.token }}
        run: |
          number=$(gh pr list --head "$BRANCH" --state open --json number -q '.[0].number')
          if [ -n "$number" ]; then
            gh pr close "$number" --delete-branch \
              --comment "最新一轮追踪在这个范围内没有发现 main 尚未收录的版本，这个 PR 不再需要。"
          fi

      - name: Verify the new archives
        if: steps.track.outputs.added != '0'
        run: node scripts/validate-index.mjs lithe-plugin-index.json --verify-archives --base "$RUNNER_TEMP/base-index.json"

      - name: Open or update the pull request
        id: pr
        if: steps.track.outputs.added != '0'
        env:
          GH_TOKEN: ${{ steps.bot.outputs.token || secrets.STORE_BOT_TOKEN || github.token }}
          SUMMARY: ${{ steps.track.outputs.summary }}
          NEW_PLUGINS: ${{ steps.track.outputs.new_plugins }}
        run: |
          git config user.name "lithe-store-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -C "$BRANCH"
          # main is protected, so Sync README could only follow up with a second
          # pull request. Render the overview here so one merge covers both.
          node scripts/render-readme.mjs
          git add lithe-plugin-index.json README.md
          git commit -m "chore(index): track $SCOPE plugin releases" -m "$SUMMARY"
          git push --force origin "$BRANCH"

          list=$(echo "$SUMMARY" | tr ',' '\n' | sed 's/^ */- /')
          checks="已校验 SHA-256 与包内 plugin.json（id、version、pluginAPIVersion、signatureRequirement），README 总览已一并重新生成。"
          if [ "$SCOPE" = organization ]; then
            review="这些插件的仓库属于 Lithe-IDEA 组织，工作流会在校验通过后直接合入 main。如果这个 PR 仍处于打开状态，说明自动合入没有成功（原因见工作流日志），请维护者按 docs/maintainers.md 的清单审查后合并。"
          else
            review="这些插件来自 Lithe-IDEA 组织以外的仓库，维护者请按 docs/maintainers.md 的清单审查后合并。"
          fi
          body=$(printf '自动追踪到新的插件版本：\n\n%s\n\n%s%s' "$list" "$checks" "$review")
          if [ -n "$NEW_PLUGINS" ]; then
            # The next scan rebuilds this branch from main, so metadata fixes belong in a follow-up PR.
            body="$body$(printf '\n\n首次收录：%s。条目由插件仓库的简介、许可证、topics 和包内 plugin.json 自动生成，没有图标和中文简介，description 沿用仓库简介的语言。合并后请另提 PR 补充 icon、localizedDescriptions 和 tags，不要直接改这个分支，下一轮扫描会覆盖它。' "$NEW_PLUGINS")"
          fi

          number=$(gh pr list --head "$BRANCH" --state open --json number -q '.[0].number')
          if [ -n "$number" ]; then
            gh pr edit "$number" --title "$TITLE" --body "$body"
          else
            gh pr create --base main --head "$BRANCH" --title "$TITLE" --body "$body" --label new-version || \
              gh pr create --base main --head "$BRANCH" --title "$TITLE" --body "$body"
            number=$(gh pr list --head "$BRANCH" --state open --json number -q '.[0].number')
          fi
          echo "number=$number" >> "$GITHUB_OUTPUT"

      - name: Merge the organization pull request
        if: matrix.scope == 'organization' && steps.track.outputs.added != '0'
        env:
          # Only the app can pass the ruleset, so this step never falls back to another token.
          GH_TOKEN: ${{ steps.bot.outputs.token }}
          NUMBER: ${{ steps.pr.outputs.number }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::warning::The Lithe Store Bot app is not configured (STORE_BOT_APP_CLIENT_ID, STORE_BOT_APP_PRIVATE_KEY), so pull request #$NUMBER stays open for a maintainer to merge."
            exit 0
          fi
          # --match-head-commit makes GitHub refuse the merge if the branch no
          # longer points at the commit that this run verified.
          if ! gh pr merge "$NUMBER" --squash --match-head-commit "$(git rev-parse HEAD)"; then
            echo "::warning::Could not merge pull request #$NUMBER, so it stays open for a maintainer to merge."
            exit 0
          fi
          git push origin --delete "$BRANCH"
